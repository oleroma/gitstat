name: Prune old builds

# Deletes the pre-releases of old builds daily (.agents/prune-releases): keeps the newest 20 and
# every build on an open PR's branch, and keeps all build/<n> tags. PC builds also run it after
# each upload; this covers CI builds. Run it by hand from the Actions tab too.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-releases

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Delete old build pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .agents/prune-releases
