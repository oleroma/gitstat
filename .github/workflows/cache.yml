name: Main cache

# Keeps main's build caches warm, so the fallback build (fallback.yml) on a new branch starts
# from them: GitHub lets a branch read only its own caches and main's. Runs after each push to
# main and only compiles, with the same cache setup as fallback.yml. It runs no tests or checks,
# sets no status, and nothing waits for it.
# The one exception: agent-build ci waits up to 30 minutes for a running one. Every job has a timeout-minutes.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: read

concurrency:
  group: main-cache
  cancel-in-progress: true

jobs:
  # Same job id as fallback.yml's job: rust-cache keys its caches by job id.
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> build/target"

      # What the quick-test, build and full-check hooks compile, without running or checking it.
      # CARGO_TARGET_DIR is set per command, as the hooks do: a job-level CARGO_* variable would
      # change rust-cache's key and miss fallback.yml's cache.
      - run: CARGO_TARGET_DIR=build/target cargo test --locked --no-run
      - run: CARGO_TARGET_DIR=build/target cargo build --release --locked
      - run: CARGO_TARGET_DIR=build/target cargo clippy --locked --all-targets
