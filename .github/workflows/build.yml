name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build gitstat.exe
        run: cargo build --release --locked
      - name: Smoke test
        shell: bash
        run: ./target/release/gitstat.exe --once --no-fetch --config "$RUNNER_TEMP/config.json" || [ $? -eq 1 ]
      - uses: actions/upload-artifact@v4
        with:
          name: gitstat-windows-x64
          path: |
            target/release/gitstat.exe
            README.md
          if-no-files-found: error
