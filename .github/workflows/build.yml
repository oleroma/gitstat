# Light checks only. Heavy work (release build, Windows test suite) runs on
# the dev PC; see README. No artifacts are published.
name: build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  linux:
    # The platform-neutral modules and the notify (inotify) integration tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  windows:
    # Compile + lint only; the Windows tests and the release build run on the PC.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
