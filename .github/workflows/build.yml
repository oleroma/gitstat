# Tests and lint only, on Linux. All builds, including every Windows build
# and the Windows tests, run on the dev PC; see README. Nothing is published.
name: checks

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  linux:
    # The platform-neutral modules and the notify (inotify) integration tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
