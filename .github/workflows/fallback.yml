name: Fallback build

# The fallback for a PC build (AGENTS.md step 3), started by agent-build ci on a feature branch:
#   gh workflow run fallback.yml --ref <branch>
# It does what a PC build does, with the same hooks in .agents/hooks/: quick tests, build,
# full checks. When they all pass it marks the commit checked, as PC builds do.
# Each build is published as a pre-release on its build/<n> tag before the full checks, and
# agent-build takes its links and files from there. It never runs on a push.
# Every job has a timeout-minutes. Keep its actions on the Node 24 runtime.
# gitstat.exe builds only on Windows, so everything runs there.
on:
  workflow_dispatch:

permissions:
  contents: write # the build number step pushes a build/<n> tag
  statuses: write # marks the commit checked

concurrency:
  group: fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> build/target"

      - name: Quick tests
        run: bash .agents/hooks/quick-test

      - name: Build number
        run: n="$(bash .agents/build-number)" && echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: |
          set -o pipefail
          bash .agents/hooks/build | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r' <"$RUNNER_TEMP/build.out" | sed -n 's/^build-file: [^ ]* \([^ ]*\)$/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      # Every build is published as a pre-release on its build/<n> tag, before the full checks
      # so it's ready sooner; only the full checks mark the commit checked for agent-merge.
      - name: Publish the build
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.build.outputs.file }}
          VERSION: ${{ steps.build.outputs.version }}
        run: >-
          gh release create "build/$BUILD_NUMBER" "$FILE" --verify-tag --prerelease
          --title "$VERSION" --notes "CI fallback build of $GITHUB_REF_NAME ($GITHUB_SHA)"

      - name: Full checks
        run: bash .agents/hooks/full-check

      # agent-build pc reuses this build's pre-release when this status says it passed in CI.
      - name: Mark the commit checked
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: >-
          test -n "$VERSION" &&
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=success -f context=full-check -f description="Passed in CI: version $VERSION"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
