name: Fallback build

# The fallback for a PC build (AGENTS.md step 3), started by agent-build ci on a feature branch:
#   gh workflow run fallback.yml --ref <branch> -f checks=false
# It does what a PC build does, with the same hooks in .agents/hooks/: quick tests, build,
# publish (a pre-release on its build/<n> tag, where agent-build takes its links and files),
# then marks the commit ci-build. With checks=true (agent-check ci, before the merge) it only
# runs the full checks and marks the commit checked, as agent-check pc does. It never runs on a push.
# Every job has a timeout-minutes. Keep its actions on the Node 24 runtime.
# gitstat.exe builds only on Windows, so everything runs there.
on:
  workflow_dispatch:
    inputs:
      checks:
        description: Run only the full checks (before the merge), no build
        type: boolean
        default: false

permissions:
  contents: write # the build number step pushes a build/<n> tag
  statuses: write # marks the commit checked

concurrency:
  group: fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> build/target"

      - name: Quick tests
        if: ${{ !inputs.checks }}
        run: bash .agents/hooks/quick-test

      - name: Build number
        if: ${{ !inputs.checks }}
        run: n="$(bash .agents/build-number)" && echo "BUILD_NUMBER=$n" >> "$GITHUB_ENV"

      - name: Build
        if: ${{ !inputs.checks }}
        id: build
        run: |
          set -o pipefail
          bash .agents/hooks/build | tee "$RUNNER_TEMP/build.out"
          file="$(sed -n 's/^build-file: \([^ ]*\) .*/\1/p' "$RUNNER_TEMP/build.out" | head -n 1)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "version=$(tr -d '\r' <"$RUNNER_TEMP/build.out" | sed -n 's/^build-file: [^ ]* \([^ ]*\)$/\1/p' | head -n 1)" >> "$GITHUB_OUTPUT"
          echo "$(basename "$file")  SHA-256 \`$(sha256sum "$file" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the build
        if: ${{ !inputs.checks }}
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.build.outputs.file }}
          VERSION: ${{ steps.build.outputs.version }}
        run: >-
          gh release create "build/$BUILD_NUMBER" "$FILE" --verify-tag --prerelease
          --title "$VERSION" --notes "$(bash .agents/release-notes "$GITHUB_SHA" "$BUILD_NUMBER" "CI fallback build of $GITHUB_REF_NAME ($GITHUB_SHA)")"

      - name: Full checks
        if: ${{ inputs.checks }}
        run: bash .agents/hooks/full-check

      # agent-build pc reuses this build's pre-release when this status says CI built it.
      - name: Mark the commit built
        if: ${{ !inputs.checks }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: >-
          test -n "$VERSION" &&
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=success -f context=ci-build -f description="Built in CI: version $VERSION"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Mark the commit checked
        if: ${{ inputs.checks }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state=success -f context=full-check -f description="Passed in CI"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
